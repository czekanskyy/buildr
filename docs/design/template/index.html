<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buildr – edytor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Manrope:wght@300;400;500;600;700&amp;family=Fraunces:ital,wght@0,400;0,600;1,400&amp;family=DM+Sans:wght@400;500;700&amp;family=Lora:ital,wght@0,400;0,600;1,400&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/metrics.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/editor.css">
<link rel="stylesheet" href="css/template.css">
</head>
<body class="tpl-page">
<nav class="tpl-nav buildr-editor" aria-label="Strony szablonu">
  <b>Buildr – szablon</b>
  <a href="index.html" aria-current="page">Edytor</a>
  <a href="style-panel.html">Panel ustawień</a>
  <a href="components.html">Komponenty</a>
</nav>
<main class="tpl-main" data-mount="editor"></main>

<script type="text/x-template" data-component="editor">
<div class="buildr-editor bd-shell" data-theme="{{theme}}" style="grid-template-columns: {{cols}}; font-family: var(--font-sans); color: var(--bd-text);">

  <!-- ================= TOP BAR ================= -->
  <header class="bd-topbar" aria-label="Pasek narzędzi">
    <div class="bd-cluster">
      <button class="bd-iconbtn" type="button" aria-label="Wróć do panelu CMS" data-tip="Wróć do panelu CMS" data-tip-pos="start">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg>
      </button>
      <div class="bd-logo">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect class="m2" x="2" y="11" width="13" height="11" rx="3"></rect><rect class="m1" x="9" y="2" width="13" height="13" rx="3"></rect></svg>
        <span>Buildr</span>
      </div>
      <span class="bd-divider" aria-hidden="true"></span>
      <button class="bd-iconbtn" type="button" aria-label="Panel bloków i struktury" aria-pressed="{{leftOpenStr}}" data-tip="Panel bloków i struktury" onClick="{{toggleLeft}}">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"></rect><path d="M9 3v18"></path></svg>
      </button>
      <button class="bd-iconbtn" type="button" aria-label="Cofnij" data-tip="Cofnij (Ctrl+Z)">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"></path><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"></path></svg>
      </button>
      <button class="bd-iconbtn" type="button" aria-label="Ponów" data-tip="Ponów (Ctrl+Shift+Z)" disabled="{{yes}}">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 14 5-5-5-5"></path><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"></path></svg>
      </button>
    </div>

    <div class="bd-cluster">
      <button class="bd-doc" type="button" aria-label="Strona główna – opcje strony" data-tip="Nazwa, adres i przykładowe dane">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--bd-toolbar-muted)"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"></path><path d="M14 2v4a2 2 0 0 0 2 2h4"></path></svg>
        <span class="bd-doc__title">Strona główna</span>
        <span class="bd-chip">Szkic</span>
        <svg class="i bd-doc__chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
      </button>
    </div>

    <div class="bd-cluster bd-cluster--end" style="position: relative">
      <div class="bd-seg" role="radiogroup" aria-label="Rozmiar ekranu">
        <button class="bd-seg__item" type="button" role="radio" aria-checked="{{dev.desktop}}" aria-label="Komputer" data-tip="Komputer" onClick="{{setDesktop}}">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="3" width="20" height="14" rx="2"></rect><path d="M8 21h8"></path><path d="M12 17v4"></path></svg>
        </button>
        <button class="bd-seg__item" type="button" role="radio" aria-checked="{{dev.tablet}}" aria-label="Tablet" data-tip="Tablet · 768 px" onClick="{{setTablet}}">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="2" width="16" height="20" rx="2"></rect><path d="M12 18h.01"></path></svg>
        </button>
        <button class="bd-seg__item" type="button" role="radio" aria-checked="{{dev.mobile}}" aria-label="Telefon" data-tip="Telefon · 390 px" onClick="{{setMobile}}">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="2"></rect><path d="M12 18h.01"></path></svg>
        </button>
      </div>
      <span class="bd-divider" aria-hidden="true"></span>
      <span class="bd-save" role="status">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="m8.5 12 2.5 2.5 4.5-5"></path></svg>
        Zapisano
      </span>
      <button class="bd-btn bd-btn--ghost" type="button" aria-label="Język treści: polski" data-tip="Język treści" style="padding: 0 var(--bd-space-2); gap: var(--bd-space-1)">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--bd-toolbar-muted)"><circle cx="12" cy="12" r="9"></circle><path d="M12 3a14 14 0 0 0 0 18 14 14 0 0 0 0-18"></path><path d="M3 12h18"></path></svg>
        <span class="bd-tabular" style="font-size: var(--bd-text-sm)">PL</span>
      </button>
      <button class="bd-iconbtn" type="button" aria-label="Historia wersji" data-tip="Historia wersji">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 2.64-6.36L3 8"></path><path d="M3 3v5h5"></path><path d="M12 7v5l3 2"></path></svg>
      </button>
      <button class="bd-iconbtn" type="button" aria-label="Podgląd strony" data-tip="Podgląd w nowej karcie">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
      </button>
      <button class="bd-iconbtn" type="button" aria-label="Więcej opcji" aria-haspopup="menu" aria-expanded="{{menuOpenStr}}" data-tip="Więcej opcji" data-tip-pos="end" onClick="{{toggleMenu}}">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h.01M12 12h.01M19 12h.01" style="stroke-width: 3"></path></svg>
      </button>
      <button class="bd-iconbtn" type="button" aria-label="Panel ustawień bloku" aria-pressed="{{rightOpenStr}}" data-tip="Panel ustawień bloku" data-tip-pos="end" onClick="{{toggleRight}}">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"></rect><path d="M15 3v18"></path></svg>
      </button>
      <button class="bd-btn bd-btn--primary" type="button" style="margin-left: var(--bd-space-1)" aria-haspopup="dialog" onClick="{{openPublish}}">Opublikuj</button>

      <sc-if value="{{menuOpen}}" hint-placeholder-val="{{false}}">
        <div class="bd-menu" role="menu" aria-label="Więcej opcji" style="top: calc(100% + 10px); right: 116px;">
          <div class="bd-menu__label">Motyw edytora</div>
          <div style="padding: 0 var(--bd-space-1) var(--bd-space-1)">
            <div class="bd-seg" role="radiogroup" aria-label="Motyw edytora">
              <button class="bd-seg__item" type="button" role="radio" aria-checked="{{th.light}}" onClick="{{setLight}}">Jasny</button>
              <button class="bd-seg__item" type="button" role="radio" aria-checked="{{th.dark}}" onClick="{{setDark}}">Ciemny</button>
              <button class="bd-seg__item" type="button" role="radio" aria-checked="{{th.system}}" onClick="{{setSystem}}">Systemowy</button>
            </div>
          </div>
          <div class="bd-menu__sep"></div>
          <button class="bd-menu__item" type="button" role="menuitemcheckbox" aria-checked="{{guidesStr}}" onClick="{{toggleGuides}}">
            <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2" stroke-dasharray="3 3"></rect></svg>
            Pokaż obrysy bloków
            <span class="kbd">{{guidesMark}}</span>
          </button>
          <button class="bd-menu__item" type="button" role="menuitem">
            <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="5" rx="9" ry="3"></ellipse><path d="M3 5v14a9 3 0 0 0 18 0V5"></path><path d="M3 12a9 3 0 0 0 18 0"></path></svg>
            Przykładowe dane
            <span class="kbd">Wpis: Wiosna</span>
          </button>
          <div class="bd-menu__sep"></div>
          <button class="bd-menu__item" type="button" role="menuitem" aria-haspopup="dialog" onClick="{{openKeys}}">
            <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="6" width="20" height="12" rx="2"></rect><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M8 14h8"></path></svg>
            Skróty klawiszowe
            <span class="kbd">?</span>
          </button>
          <button class="bd-menu__item" type="button" role="menuitem">
            <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3"></path><path d="M12 17h.01"></path></svg>
            Pomoc
          </button>
        </div>
      </sc-if>
    </div>
  </header>

  <!-- ================= LEFT PANEL ================= -->
  <aside class="bd-left" aria-label="Bloki i struktura">
    <sc-if value="{{leftOpen}}" hint-placeholder-val="{{true}}">
      <div class="bd-panel-head">
        <div class="bd-tabs" role="tablist" aria-label="Panel lewy">
          <button class="bd-tab" type="button" role="tab" aria-selected="{{lt.blocks}}" onClick="{{tabBlocks}}">
            <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><path d="M17.5 14v7M14 17.5h7"></path></svg>
            Bloki
          </button>
          <button class="bd-tab" type="button" role="tab" aria-selected="{{lt.tree}}" onClick="{{tabTree}}">
            <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 6H9"></path><path d="M21 12h-8"></path><path d="M21 18h-8"></path><path d="M4 4v4a2 2 0 0 0 2 2h2"></path><path d="M4 10v6a2 2 0 0 0 2 2h2"></path></svg>
            Struktura
          </button>
        </div>
        <button class="bd-iconbtn bd-iconbtn--sm" type="button" aria-label="Zwiń panel" data-tip="Zwiń panel" data-tip-pos="end" onClick="{{toggleLeft}}">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m11 17-5-5 5-5"></path><path d="m18 17-5-5 5-5"></path></svg>
        </button>
      </div>

      <sc-if value="{{lt.blocksOn}}" hint-placeholder-val="{{true}}">
        <div class="bd-panel-body bd-stack" style="gap: var(--bd-space-3)">
          <div class="bd-seg bd-seg--full" role="radiogroup" aria-label="Rodzaj elementów">
            <button class="bd-seg__item" type="button" role="radio" aria-checked="true">Bloki</button>
            <button class="bd-seg__item" type="button" role="radio" aria-checked="false">Wzorce</button>
          </div>
          <label class="bd-search">
            <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
            <span class="bd-sr">Szukaj bloków</span>
            <input type="search" placeholder="Szukaj bloków">
            <span class="bd-kbd">/</span>
          </label>
          <sc-if value="{{hasTarget}}" hint-placeholder-val="{{true}}">
            <div class="bd-target" role="status">
              <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14"></path><path d="m19 12-7 7-7-7"></path></svg>
              <span>Wstaw po: <b>{{targetName}}</b></span>
            </div>
          </sc-if>
          <div>
            <sc-for list="{{groups}}" as="g" hint-placeholder-count="5">
              <section class="bd-group">
                <button class="bd-group__head" type="button" aria-expanded="{{g.openStr}}" onClick="{{g.toggle}}">
                  <svg class="i chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
                  <span class="bd-group__label">{{g.name}}</span>
                  <span class="bd-group__count bd-tabular">{{g.count}}</span>
                </button>
                <sc-if value="{{g.open}}" hint-placeholder-val="{{true}}">
                  <div class="bd-tiles">
                    <sc-for list="{{g.tiles}}" as="t" hint-placeholder-count="6">
                      <button class="bd-tile" type="button" aria-label="{{t.aria}}" data-tip="{{t.desc}}" draggable="true">
                        <svg class="i grip" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5h.01M9 12h.01M9 19h.01M15 5h.01M15 12h.01M15 19h.01" style="stroke-width: 3.5"></path></svg>
                        <svg class="i i-20" viewBox="0 0 24 24" aria-hidden="true"><path d="{{t.d1}}"></path><path d="{{t.d2}}"></path><path d="{{t.d3}}"></path></svg>
                        <span>{{t.name}}</span>
                      </button>
                    </sc-for>
                  </div>
                </sc-if>
              </section>
            </sc-for>
          </div>
        </div>
      </sc-if>

      <sc-if value="{{lt.treeOn}}" hint-placeholder-val="{{false}}">
        <div class="bd-panel-body" style="padding-left: var(--bd-space-2); padding-right: var(--bd-space-2)">
          <ul class="bd-tree2" role="tree" aria-label="Struktura strony">
            <sc-for list="{{tree}}" as="r" hint-placeholder-count="12">
              <li role="treeitem" aria-selected="{{r.selStr}}">
                <div class="{{r.cls}}">
                  <sc-for list="{{r.guides}}" as="gd" hint-placeholder-count="1"><span class="bd-trow__guide" aria-hidden="true"></span></sc-for>
                  <sc-if value="{{r.hasKids}}" hint-placeholder-val="{{true}}"><span class="bd-trow__tw" aria-hidden="true"><svg class="i" viewBox="0 0 24 24" style="transform: rotate(90deg)"><path d="m9 18 6-6-6-6"></path></svg></span></sc-if>
                  <sc-if value="{{r.noKids}}" hint-placeholder-val="{{false}}"><span class="bd-trow__tw bd-trow__tw--none" aria-hidden="true"></span></sc-if>
                  <button class="bd-trow__main" type="button" onClick="{{r.pick}}">
                    <svg class="i ico" viewBox="0 0 24 24" aria-hidden="true"><path d="{{r.d1}}"></path><path d="{{r.d2}}"></path><path d="{{r.d3}}"></path></svg>
                    <span class="bd-trow__name">{{r.name}}</span>
                    <span class="bd-trow__label">{{r.label}}</span>
                  </button>
                  <span class="bd-trow__acts">
                    <button class="bd-iconbtn" type="button" aria-label="Ukryj w edytorze" data-tip="Ukryj w edytorze" data-tip-pos="end"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
                    <button class="bd-iconbtn" type="button" aria-label="Zablokuj" data-tip="Zablokuj" data-tip-pos="end"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 7.5-2"></path></svg></button>
                  </span>
                </div>
              </li>
            </sc-for>
          </ul>
        </div>
      </sc-if>
    </sc-if>

    <sc-if value="{{leftClosed}}" hint-placeholder-val="{{false}}">
      <div class="bd-rail">
        <button class="bd-iconbtn" type="button" aria-label="Bloki" data-tip="Bloki" data-tip-pos="right" onClick="{{openBlocks}}">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><path d="M17.5 14v7M14 17.5h7"></path></svg>
        </button>
        <button class="bd-iconbtn" type="button" aria-label="Struktura" data-tip="Struktura" data-tip-pos="right" onClick="{{openTree}}">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 6H9"></path><path d="M21 12h-8"></path><path d="M21 18h-8"></path><path d="M4 4v4a2 2 0 0 0 2 2h2"></path><path d="M4 10v6a2 2 0 0 0 2 2h2"></path></svg>
        </button>
      </div>
    </sc-if>
    <div class="bd-splitter" role="separator" aria-orientation="vertical" aria-label="Zmień szerokość panelu bloków" tabindex="0"></div>
  </aside>

  <!-- ================= STAGE ================= -->
  <main class="bd-stage" aria-label="Kanwa">
    <div class="bd-stage__scroll" onClick="{{clearSel}}" onKeyDown="{{canvasKey}}">
      <sc-if value="{{isDevice}}" hint-placeholder-val="{{false}}">
        <div class="bd-device-label bd-tabular">{{deviceLabel}}</div>
      </sc-if>
      <div class="{{frameCls}}" style="width: {{frameW}}" ref="{{frameRef}}">
        <div class="site">
          <div class="site-nav"><b>Pracownia Kadr</b><nav><span>Oferta</span><span>Realizacje</span><span>O nas</span><span>Kontakt</span></nav></div>

          <!-- Hero -->
          <div class="blk blk-c {{c.hero}}" data-blk="hero" style="{{st.hero}}" aria-label="{{al.hero}}" tabindex="0" onClick="{{p.hero}}">
            <div class="blk blk-c site-hero {{c.heroCols}}" data-blk="heroCols" style="{{st.heroCols}}" aria-label="{{al.heroCols}}" tabindex="0" onClick="{{p.heroCols}}">
              <div class="blk blk-c {{c.heroCol1}}" data-blk="heroCol1" style="{{st.heroCol1}}" aria-label="{{al.heroCol1}}" tabindex="0" onClick="{{p.heroCol1}}">
                <div class="site-eyebrow">Projektowanie wnętrz</div>
                <div class="blk {{c.heroH}}" data-blk="heroH" style="{{st.heroH}}" aria-label="{{al.heroH}}" tabindex="0" onClick="{{p.heroH}}"><h1>{{tx.heroH}}</h1></div>
                <div class="blk {{c.heroP}}" data-blk="heroP" style="{{st.heroP}}" aria-label="{{al.heroP}}" tabindex="0" onClick="{{p.heroP}}"><p class="site-lead">Projektujemy mieszkania i małe biura od pierwszego szkicu po odbiór. Spokojnie, z jasnym planem i budżetem.</p></div>
                <div class="site-actions">
                  <div class="blk blk--inline {{c.heroBtn}}" data-blk="heroBtn" style="{{st.heroBtn}}" aria-label="{{al.heroBtn}}" tabindex="0" onClick="{{p.heroBtn}}"><span class="site-btn o-skin">{{tx.heroBtn}}</span></div>
                  <div class="blk blk--inline {{c.heroBtn2}}" data-blk="heroBtn2" style="{{st.heroBtn2}}" aria-label="{{al.heroBtn2}}" tabindex="0" onClick="{{p.heroBtn2}}"><span class="site-btn site-btn--ghost o-skin">{{tx.heroBtn2}}</span></div>
                </div>
              </div>
              <div class="blk blk-c {{c.heroCol2}}" data-blk="heroCol2" style="{{st.heroCol2}}" aria-label="{{al.heroCol2}}" tabindex="0" onClick="{{p.heroCol2}}">
                <div class="blk {{c.heroImg}}" data-blk="heroImg" style="{{st.heroImg}}" aria-label="{{al.heroImg}}" tabindex="0" onClick="{{p.heroImg}}">
                  <div class="site-img o-skin"><span class="site-img__cap">Salon z dużym oknem</span></div>
                </div>
              </div>
            </div>
          </div>

          <div class="bd-ins"><div class="bd-ins__hit"><span class="bd-ins__line"></span><button class="bd-ins__btn" type="button" aria-label="Dodaj blok tutaj" data-tip="Dodaj blok tutaj" data-tip-pos="top" onClick="{{openBlocks}}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></button></div></div>

          <!-- Offer: three cards -->
          <div class="blk blk-c {{c.offer}}" data-blk="offer" style="{{st.offer}}" aria-label="{{al.offer}}" tabindex="0" onClick="{{p.offer}}">
            <div class="site-sec">
              <div class="blk {{c.offerH}}" data-blk="offerH" style="{{st.offerH}}" aria-label="{{al.offerH}}" tabindex="0" onClick="{{p.offerH}}">
                <div class="site-sec__head"><h2>{{tx.offerH}}</h2><p>Możesz zamówić cały proces albo tylko wybrany etap.</p></div>
              </div>
              <div class="blk blk-c site-cards {{c.offerCols}}" data-blk="offerCols" style="{{st.offerCols}}" aria-label="{{al.offerCols}}" tabindex="0" onClick="{{p.offerCols}}">
                <div class="blk blk-c site-card {{c.card1}}" data-blk="card1" style="{{st.card1}}" aria-label="{{al.card1}}" tabindex="0" onClick="{{p.card1}}">
                  <div class="site-card__ico"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg></div>
                  <h3>{{tx.card1}}</h3><p>Układ funkcjonalny, moodboard i dwa warianty aranżacji do wyboru.</p><a href="#oferta">Szczegóły etapu</a>
                </div>
                <div class="blk blk-c site-card {{c.card2}}" data-blk="card2" style="{{st.card2}}" aria-label="{{al.card2}}" tabindex="0" onClick="{{p.card2}}">
                  <div class="site-card__ico"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3h18v18H3z"></path><path d="M3 9h18M9 21V9"></path></svg></div>
                  <h3>{{tx.card2}}</h3><p>Rysunki dla ekipy, zestawienie materiałów i kosztorys.</p><a href="#oferta">Szczegóły etapu</a>
                </div>
                <div class="blk blk-c site-card {{c.card3}}" data-blk="card3" style="{{st.card3}}" aria-label="{{al.card3}}" tabindex="0" onClick="{{p.card3}}">

  <sc-if value="{{dlgPublish}}" hint-placeholder-val="{{false}}">
    <div class="bd-scrim" onClick="{{scrimClose}}" onKeyDown="{{dlgKey}}"><div class="bd-dialog " role="dialog" aria-modal="true" aria-labelledby="dlg-pub-t">
  <div class="bd-dialog__head"><span class="bd-dialog__icon"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 2 11 13"></path><path d="m22 2-7 20-4-9-9-4z"></path></svg></span><h2 id="dlg-pub-t">Opublikować stronę?</h2><button class="bd-iconbtn bd-iconbtn--sm" type="button" aria-label="Zamknij" data-tip="Zamknij (Esc)" data-tip-pos="end" onClick="{{closeDlg}}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button></div>
  <div class="bd-dialog__body">
    <p>Strona <b style="color: var(--bd-text)">Strona główna</b> będzie widoczna dla wszystkich pod adresem <b style="color: var(--bd-text)">pracowniakadr.pl/</b>.</p>
    <div class="bd-list">
      <sc-if value="{{issue1}}" hint-placeholder-val="{{true}}"><button class="bd-list__row" type="button" onClick="{{showIssues}}"><svg class="i w" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v4"></path><path d="M12 16h.01"></path></svg><span style="flex: 1">Obraz nie ma tekstu alternatywnego</span><small>Baner › Obraz</small></button></sc-if>
      <sc-if value="{{issue2}}" hint-placeholder-val="{{true}}"><button class="bd-list__row" type="button" onClick="{{showIssues}}"><svg class="i w" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v4"></path><path d="M12 16h.01"></path></svg><span style="flex: 1">Przycisk „Zobacz realizacje” nie ma adresu</span><small>Baner › Przycisk</small></button></sc-if>
      <div class="bd-list__row"><svg class="i ok" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="m8 12 3 3 5-6"></path></svg><span style="flex: 1">Tytuł i opis dla wyszukiwarek są uzupełnione</span></div>
    </div>
    <p style="font-size: var(--bd-text-sm)">Ostrzeżenia nie blokują publikacji ({{issueText}}). Możesz je poprawić później.</p>
    <div class="bd-cards bd-cards--3" role="radiogroup" aria-label="Kiedy opublikować" style="grid-template-columns: repeat(2, minmax(0, 1fr))">
      <button class="bd-rcard" type="button" role="radio" aria-checked="true" style="align-items: flex-start; text-align: left; padding: var(--bd-space-3)"><b style="font-size: var(--bd-text-md)">Teraz</b><span style="font-size: var(--bd-text-xs)">Zmiany od razu na stronie</span></button>
      <button class="bd-rcard" type="button" role="radio" aria-checked="false" style="align-items: flex-start; text-align: left; padding: var(--bd-space-3)"><b style="font-size: var(--bd-text-md)">Zaplanuj</b><span style="font-size: var(--bd-text-xs)">Wybierz dzień i godzinę</span></button>
    </div>
  </div>
  <div class="bd-dialog__foot"><span class="sp"></span><button class="bd-btn" type="button" onClick="{{closeDlg}}">Anuluj</button><button class="bd-btn bd-btn--primary" type="button" onClick="{{doPublish}}">Opublikuj</button></div>
</div></div>
  </sc-if>
  <sc-if value="{{dlgKeys}}" hint-placeholder-val="{{false}}">
    <div class="bd-scrim" onClick="{{scrimClose}}" onKeyDown="{{dlgKey}}"><div class="bd-dialog bd-dialog--wide" role="dialog" aria-modal="true" aria-labelledby="dlg-keys-t">
  <div class="bd-dialog__head"><h2 id="dlg-keys-t">Skróty klawiszowe</h2><button class="bd-iconbtn bd-iconbtn--sm" type="button" aria-label="Zamknij" data-tip="Zamknij (Esc)" data-tip-pos="end" onClick="{{closeDlg}}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button></div>
  <div class="bd-dialog__body"><div class="bd-keys"><h3>Ogólne</h3><div><span>Zapisz</span><span class="bd-kbd">Ctrl</span><span class="bd-kbd">S</span></div><div><span>Cofnij</span><span class="bd-kbd">Ctrl</span><span class="bd-kbd">Z</span></div><div><span>Ponów</span><span class="bd-kbd">Ctrl</span><span class="bd-kbd">Shift</span><span class="bd-kbd">Z</span></div><div><span>Szukaj bloku</span><span class="bd-kbd">/</span></div><div><span>Pokaż skróty</span><span class="bd-kbd">?</span></div><h3>Zaznaczanie</h3><div><span>Zaznacz blok</span><span class="bd-kbd">Enter</span></div><div><span>Zaznacz blok nadrzędny</span><span class="bd-kbd">Esc</span></div><div><span>Następny blok</span><span class="bd-kbd">Tab</span></div><div><span>Poprzedni blok</span><span class="bd-kbd">Shift</span><span class="bd-kbd">Tab</span></div><h3>Bloki</h3><div><span>Duplikuj</span><span class="bd-kbd">Ctrl</span><span class="bd-kbd">D</span></div><div><span>Usuń</span><span class="bd-kbd">Delete</span></div><div><span>Kopiuj / wklej</span><span class="bd-kbd">Ctrl</span><span class="bd-kbd">C</span><span style="flex: none; color: var(--bd-text-subtle)">/</span><span class="bd-kbd">Ctrl</span><span class="bd-kbd">V</span></div><div><span>Przesuń wyżej</span><span class="bd-kbd">Alt</span><span class="bd-kbd" aria-label="strzałka w górę"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5"></path><path d="m5 12 7-7 7 7"></path></svg></span></div><div><span>Przesuń niżej</span><span class="bd-kbd">Alt</span><span class="bd-kbd" aria-label="strzałka w dół"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14"></path><path d="m19 12-7 7-7-7"></path></svg></span></div><h3>Widok</h3><div><span>Komputer / tablet / telefon</span><span class="bd-kbd">Ctrl</span><span class="bd-kbd">1</span><span class="bd-kbd">2</span><span class="bd-kbd">3</span></div><div><span>Pokaż lub ukryj panele</span><span class="bd-kbd">Ctrl</span><span class="bd-kbd">.</span></div><div><span>Obrysy bloków</span><span class="bd-kbd">Ctrl</span><span class="bd-kbd">Shift</span><span class="bd-kbd">O</span></div></div><p style="font-size: var(--bd-text-xs)">Na Macu zamiast Ctrl używaj Cmd.</p></div>
</div></div>
  </sc-if>
</div>
</script>
<script src="js/runtime.js"></script>
<script src="js/editor.js"></script>
</body>
</html>
