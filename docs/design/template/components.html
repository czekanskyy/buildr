<script type="text/x-template" data-component="left-panel">
<div class="buildr-editor" data-theme="{{theme}}" style="width: 1600px; height: 1060px; box-sizing: border-box; padding: var(--bd-space-6); background: var(--bd-bg); font-family: var(--font-sans); color: var(--bd-text); display: grid; grid-template-columns: repeat(4, 280px) minmax(0, 1fr); gap: var(--bd-space-6)">

  <!-- ============ 1. BLOKI ============ -->
  <div class="lp-col">
    <header><h2>Bloki</h2><p>Kliknięcie wstawia blok w miejscu pokazanym nad listą; przeciągnięcie – tam, gdzie upuścisz. Grupy pamiętają stan.</p></header>
    <div class="bd-panel-frame">
      <div class="bd-panel-head">
        <div class="bd-tabs" role="tablist" aria-label="Panel lewy">
          <button class="bd-tab" type="button" role="tab" aria-selected="true">Bloki</button>
          <button class="bd-tab" type="button" role="tab" aria-selected="false">Struktura</button>
        </div>
        <button class="bd-iconbtn bd-iconbtn--sm" type="button" aria-label="Zwiń panel" data-tip="Zwiń panel" data-tip-pos="end"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m11 17-5-5 5-5"></path><path d="m18 17-5-5 5-5"></path></svg></button>
      </div>
      <div class="bd-panel-body bd-stack" style="gap: var(--bd-space-3)">
        <div class="bd-seg bd-seg--full" role="radiogroup" aria-label="Rodzaj elementów">
          <button class="bd-seg__item" type="button" role="radio" aria-checked="{{v1.blocks}}" onClick="{{v1.toBlocks}}">Bloki</button>
          <button class="bd-seg__item" type="button" role="radio" aria-checked="{{v1.patterns}}" onClick="{{v1.toPatterns}}">Wzorce</button>
        </div>
        <label class="bd-search">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
          <span class="bd-sr">Szukaj bloków</span>
          <input type="search" placeholder="Szukaj bloków" value="{{q1}}" onChange="{{onQ1}}">
          <span class="bd-kbd">/</span>
        </label>
        <div class="bd-target" role="status">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14"></path><path d="m19 12-7 7-7-7"></path></svg>
          <span>Wstaw po: <b>Przycisk</b></span>
          <button class="bd-iconbtn" type="button" aria-label="Wstawiaj na końcu strony" data-tip="Wstawiaj na końcu strony" data-tip-pos="end"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 12px; height: 12px"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button>
        </div>

        <sc-if value="{{L1.browse}}" hint-placeholder-val="{{true}}">
          <div>
            <sc-for list="{{L1.groups}}" as="g" hint-placeholder-count="6">
              <section class="bd-group">
                <button class="bd-group__head" type="button" aria-expanded="{{g.openStr}}" onClick="{{g.toggle}}">
                  <svg class="i chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
                  <span class="bd-group__label">{{g.name}}</span>
                  <span class="bd-group__count bd-tabular">{{g.count}}</span>
                </button>
                <sc-if value="{{g.open}}" hint-placeholder-val="{{true}}">
                  <div class="bd-tiles">
                    <sc-for list="{{g.tiles}}" as="t" hint-placeholder-count="3">
                      <button class="bd-tile" type="button" aria-label="{{t.aria}}" data-tip="{{t.desc}}" draggable="true">
                        <svg class="i grip" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5h.01M9 12h.01M9 19h.01M15 5h.01M15 12h.01M15 19h.01" style="stroke-width: 3.5"></path></svg>
                        <svg class="i i-20" viewBox="0 0 24 24" aria-hidden="true"><path d="{{t.d1}}"></path><path d="{{t.d2}}"></path><path d="{{t.d3}}"></path></svg>
                        <span>{{t.name}}</span>
                      </button>
                    </sc-for>
                  </div>
                </sc-if>
              </section>
            </sc-for>
          </div>
        </sc-if>
        <sc-if value="{{L1.search}}" hint-placeholder-val="{{false}}">
          <div>
            <p class="lp-sub">{{L1.countLabel}}</p>
            <ul class="bd-results">
              <sc-for list="{{L1.results}}" as="r" hint-placeholder-count="3">
                <li><button class="bd-res" type="button" aria-label="{{r.aria}}" draggable="true">
                  <span class="bd-res__ico"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="{{r.d1}}"></path><path d="{{r.d2}}"></path><path d="{{r.d3}}"></path></svg></span>
                  <span class="bd-res__txt"><span>{{r.pre}}<mark>{{r.mid}}</mark>{{r.post}}</span><small>{{r.cat}} · {{r.desc}}</small></span>
                </button></li>
              </sc-for>
            </ul>
          </div>
        </sc-if>
        <sc-if value="{{L1.none}}" hint-placeholder-val="{{false}}">
          <div class="bd-empty" style="padding: var(--bd-space-5) var(--bd-space-2)">
            <div class="bd-empty__ill"><svg class="i i-20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></div>
            <strong>Brak bloków „{{q1}}”</strong>
            <span style="font-size: var(--bd-text-sm); line-height: var(--bd-leading-sm)">Sprawdź pisownię albo <button class="bd-linkbtn" type="button" onClick="{{v1.toPatterns}}">poszukaj we wzorcach</button>.</span>
          </div>
        </sc-if>
        <sc-if value="{{v1.patternsOn}}" hint-placeholder-val="{{false}}">
          <p class="bd-hint">Wzorce pokazuje kolumna obok.</p>
        </sc-if>
      </div>
    </div>
  </div>

  <!-- ============ 2. WYSZUKIWANIE ============ -->
  <div class="lp-col">
    <header><h2>Wyszukiwanie</h2><p>Od pierwszej litery kategorie znikają, a wyniki to płaska lista z opisem. Szuka też po synonimach („button”, „zdjęcie”). Wpisz coś, by sprawdzić.</p></header>
    <div class="bd-panel-frame">
      <div class="bd-panel-head">
        <div class="bd-tabs" role="tablist" aria-label="Panel lewy (przykład)">
          <button class="bd-tab" type="button" role="tab" aria-selected="true">Bloki</button>
          <button class="bd-tab" type="button" role="tab" aria-selected="false">Struktura</button>
        </div>
      </div>
      <div class="bd-panel-body bd-stack" style="gap: var(--bd-space-3)">
        <div class="bd-seg bd-seg--full" role="radiogroup" aria-label="Rodzaj elementów (przykład)">
          <button class="bd-seg__item" type="button" role="radio" aria-checked="true">Bloki</button>
          <button class="bd-seg__item" type="button" role="radio" aria-checked="false">Wzorce</button>
        </div>
        <label class="bd-search" style="border-color: var(--bd-accent); background: var(--bd-surface)">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>

          <input type="search" placeholder="Szukaj bloków" value="{{q2}}" onChange="{{onQ2}}">
          <button class="bd-iconbtn bd-iconbtn--sm" type="button" aria-label="Wyczyść wyszukiwanie" data-tip="Wyczyść" data-tip-pos="end" onClick="{{clearQ2}}" style="width: 20px; height: 20px"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 12px; height: 12px"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button>
        </label>
        <sc-if value="{{L2.browse}}" hint-placeholder-val="{{false}}"><p class="bd-hint">Wpisz nazwę bloku, np. „prz”.</p></sc-if>
        <sc-if value="{{L2.search}}" hint-placeholder-val="{{true}}">
          <div>
            <p class="lp-sub">{{L2.countLabel}}</p>
            <ul class="bd-results">
              <sc-for list="{{L2.results}}" as="r" hint-placeholder-count="3">
                <li><button class="bd-res" type="button" aria-label="{{r.aria}}" draggable="true">
                  <span class="bd-res__ico"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="{{r.d1}}"></path><path d="{{r.d2}}"></path><path d="{{r.d3}}"></path></svg></span>
                  <span class="bd-res__txt"><span>{{r.pre}}<mark>{{r.mid}}</mark>{{r.post}}</span><small>{{r.cat}} · {{r.desc}}</small></span>
                </button></li>
              </sc-for>
            </ul>
          </div>
        </sc-if>
        <sc-if value="{{L2.none}}" hint-placeholder-val="{{false}}">
          <div class="bd-empty" style="padding: var(--bd-space-5) var(--bd-space-2)">
            <div class="bd-empty__ill"><svg class="i i-20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></div>
            <strong>Brak bloków „{{q2}}”</strong>
            <span style="font-size: var(--bd-text-sm); line-height: var(--bd-leading-sm)">Sprawdź pisownię albo <button class="bd-linkbtn" type="button">poszukaj we wzorcach</button>.</span>
          </div>
        </sc-if>
      </div>
      <div class="bd-panel-foot"><span class="bd-kbd">Strzałki</span> wybór · <span class="bd-kbd">Enter</span> wstawia · <span class="bd-kbd">Esc</span> czyści</div>
    </div>
  </div>

  <!-- ============ 3. WZORCE ============ -->
  <div class="lp-col">
    <header><h2>Wzorce</h2><p>Gotowe układy z kilku bloków (dawne „Szablony”). Miniatury w kolorach strony. „Moje wzorce” to zapisane zaznaczenia.</p></header>
    <div class="bd-panel-frame">
      <div class="bd-panel-head">
        <div class="bd-tabs" role="tablist" aria-label="Panel lewy (wzorce)">

  <!-- ============ 4. STRUKTURA ============ -->

<script type="text/x-template" data-component="canvas-states">
<div class="buildr-editor" data-theme="{{theme}}" style="width: 1200px; min-height: 900px; box-sizing: border-box; padding: var(--bd-space-6); background: var(--bd-bg); font-family: var(--font-sans); color: var(--bd-text); display: flex; flex-direction: column; gap: var(--bd-space-5)">
  <div>
    <h1 style="margin: 0; font-size: var(--bd-text-xl); line-height: var(--bd-leading-xl); font-weight: var(--bd-weight-semibold)">Bloki na kanwie – stany</h1>
    <p style="margin: var(--bd-space-1) 0 0; color: var(--bd-text-muted); font-size: var(--bd-text-md)">Nakładki kanwy używają tokenów <code>bd-canvas-*</code> – identycznych w obu motywach, bo strona zawsze jest jasna.</p>
  </div>
  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--bd-space-4)">

    <div class="cs-card">
      <h2>1. Najechanie</h2>

<figure style="margin: 0; display: flex; flex-direction: column; gap: var(--bd-space-3); "><figcaption style="font-size: var(--bd-text-sm); color: var(--bd-text-muted); line-height: var(--bd-leading-sm)"><b style="display: block; color: var(--bd-text); font-size: var(--bd-text-md)">Powiadomienia</b>Na dole kanwy, nad paskiem stanu. Znikają po 5 s (błąd zostaje, aż go zamkniesz). Najechanie myszą lub fokus wstrzymuje odliczanie. Maksymalnie 3 naraz, nowe na dole. Czytniki ekranu: role="status", błąd role="alert".</figcaption><div style="display: flex; justify-content: flex-start"><div style="display: flex; flex-direction: column; gap: var(--bd-space-2); align-items: flex-start"><div class="bd-toast bd-toast--static" role="status"><svg class="i ok" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="m8 12 3 3 5-6"></path></svg><span>Opublikowano. Strona jest już widoczna.</span><button class="bd-toast__act" type="button">Zobacz stronę</button><button class="bd-iconbtn bd-iconbtn--sm" type="button" aria-label="Zamknij powiadomienie"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button></div><div class="bd-toast bd-toast--static" role="status"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path><path d="M3 3v5h5"></path></svg><span>Usunięto blok „Karta”</span><button class="bd-toast__act" type="button">Cofnij</button><button class="bd-iconbtn bd-iconbtn--sm" type="button" aria-label="Zamknij powiadomienie"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button></div><div class="bd-toast bd-toast--static" role="status"><svg class="i ok" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="m8 12 3 3 5-6"></path></svg><span>Skopiowano blok. Wklej go skrótem Ctrl+V.</span><button class="bd-iconbtn bd-iconbtn--sm" type="button" aria-label="Zamknij powiadomienie"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button></div><div class="bd-toast bd-toast--static" role="alert"><svg class="i err" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v4"></path><path d="M12 16h.01"></path></svg><span>Nie udało się zapisać. Spróbujemy ponownie za 10 s.</span><button class="bd-toast__act" type="button">Ponów teraz</button><button class="bd-iconbtn bd-iconbtn--sm" type="button" aria-label="Zamknij powiadomienie"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button></div></div></div></figure>

<script type="text/x-template" data-component="motion">
<div class="buildr-editor" data-theme="{{theme}}" style="width: 100%; min-height: 1240px; box-sizing: border-box; padding: var(--bd-space-6); font-family: var(--font-sans); color: var(--bd-text); background: var(--bd-bg); display: flex; flex-direction: column; gap: var(--bd-space-5)">
  <header style="display: flex; align-items: flex-end; gap: var(--bd-space-4)">
    <div style="flex: 1">
      <h2 style="margin: 0; font-size: var(--bd-text-xl); line-height: 24px">Ruch w edytorze</h2>
      <p style="margin: var(--bd-space-1) 0 0; font-size: var(--bd-text-sm); color: var(--bd-text-muted); max-width: 820px">Ruch tylko tam, gdzie wyjaśnia zmianę: skąd coś przyszło, dokąd poszło, co jest zaznaczone. Trzy czasy i trzy krzywe z tokenów, nic więcej. Nic nie miga i nic nie odbija się w interfejsie edytora (sprężysta krzywa jest tylko dla animacji na stronie).</p>
    </div>
    <button class="bd-btn" type="button" onClick="{{playAll}}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v16l13-8z"></path></svg>Odtwórz wszystkie</button>
    <label class="bd-switchrow" style="gap: var(--bd-space-2); font-size: var(--bd-text-sm)"><span>Symuluj „ogranicz ruch”</span><button class="bd-switch" type="button" role="switch" aria-checked="{{rmStr}}" aria-label="Symuluj ograniczenie ruchu" onClick="{{toggleRm}}"></button></label>
  </header>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) minmax(0, 1.2fr); gap: var(--bd-space-4)">
    <sc-for list="{{tokens}}" as="tk" hint-placeholder-count="4">
      <div class="bd-sheetcard" style="gap: var(--bd-space-2)">
        <h3>{{tk.title}}</h3>
        <sc-for list="{{tk.rows}}" as="r" hint-placeholder-count="3">
          <div style="display: grid; grid-template-columns: 1fr auto; gap: var(--bd-space-2); align-items: center; font-size: var(--bd-text-sm)">
            <span><b style="font-weight: var(--bd-weight-medium)">{{r.name}}</b><small style="display: block; font-size: var(--bd-text-xs); color: var(--bd-text-subtle)">{{r.use}}</small></span>
            <code style="font-family: var(--font-mono); font-size: var(--bd-text-xs); color: var(--bd-text-muted)">{{r.val}}</code>
          </div>
        </sc-for>
      </div>
    </sc-for>
  </div>

  <div class="{{gridCls}}">
    <sc-for list="{{demos}}" as="d" hint-placeholder-count="9">
      <section class="bd-mdemo" aria-label="{{d.title}}">
        <div class="bd-mbar"><h3>{{d.title}}</h3><span class="sp"></span><span class="{{rmCls}}">{{rmText}}</span><button class="bd-iconbtn bd-iconbtn--sm" type="button" aria-label="Odtwórz: {{d.title}}" data-tip="Odtwórz" data-tip-pos="end" onClick="{{d.play}}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path><path d="M3 3v5h5"></path></svg></button></div>
        <div class="bd-mstage">
          <sc-if value="{{d.is.sel}}" hint-placeholder-val="{{false}}"><div class="m-center"><div class="{{d.cls}}"></div></div></sc-if>
          <sc-if value="{{d.is.acc}}" hint-placeholder-val="{{false}}"><div class="m-center"><div class="m-acc"><div class="m-acc__head">Odstępy</div><div class="{{d.cls}}"><div class="bd-sec__inner"><div class="m-line" style="width: 70%"></div><div class="m-line" style="width: 50%"></div><div class="m-line" style="width: 60%"></div></div></div></div></div></sc-if>
          <sc-if value="{{d.is.panel}}" hint-placeholder-val="{{false}}"><div class="m-center"><div class="m-shell"><div class="{{d.cls}}"></div><div class="mid"></div><div class="side"></div></div></div></sc-if>
          <sc-if value="{{d.is.menu}}" hint-placeholder-val="{{false}}"><div style="position: absolute; top: var(--bd-space-3); right: var(--bd-space-4)"><div class="{{d.cls}}"><div class="m-line" style="width: 80%"></div><div class="m-line" style="width: 60%"></div><div class="m-line" style="width: 70%"></div></div></div></sc-if>
          <sc-if value="{{d.is.dlg}}" hint-placeholder-val="{{false}}"><div class="{{d.cls}}"><div class="m-dlg"></div></div></sc-if>
          <sc-if value="{{d.is.toast}}" hint-placeholder-val="{{false}}"><div class="{{d.cls}}"></div></sc-if>
          <sc-if value="{{d.is.insert}}" hint-placeholder-val="{{false}}"><div class="m-center"><div class="{{d.cls}}"></div></div></sc-if>
          <sc-if value="{{d.is.drop}}" hint-placeholder-val="{{false}}"><div class="m-center"><div class="m-drop"><div class="b"></div><div class="{{d.cls}}"></div><div class="b"></div></div></div></sc-if>
          <sc-if value="{{d.is.dev}}" hint-placeholder-val="{{false}}"><div class="m-center"><div class="{{d.cls}}"></div></div></sc-if>
        </div>
        <div class="bd-timeline" role="img" aria-label="Czas trwania: {{d.dur}}"><span style="left: 0; width: {{d.w}}"></span></div>
        <dl><dt>Czas</dt><dd>{{d.dur}}</dd><dt>Krzywa</dt><dd>{{d.ease}}</dd><dt>Co się rusza</dt><dd style="font-family: var(--font-sans)">{{d.what}}</dd><dt>Ogranicz ruch</dt><dd style="font-family: var(--font-sans)">{{d.rm}}</dd></dl>
      </section>
    </sc-for>
  </div>

  <div class="bd-note bd-note--info" style="font-size: var(--bd-text-sm); line-height: var(--bd-leading-sm)"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg><span>Przy „ogranicz ruch” w systemie wszystkie trzy czasy z tokenów spadają do 0 ms w jednym miejscu (tokens.css). Zmiany stanu dalej są widoczne, tylko natychmiastowe. Animacje wejścia ustawione na stronie przez użytkownika też się wyłączają, a bloki pokazują się od razu.</span></div>
</div>
</script>

<script src="js/controls.js"></script>
<script src="js/left-panel.js"></script>
<script src="js/canvas-states.js"></script>

<script src="js/motion.js"></script>
<script src="js/components-page.js"></script>
</body>
