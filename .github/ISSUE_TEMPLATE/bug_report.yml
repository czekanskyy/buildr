name: Bug report
description: Report a bug in a Buildr package
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please search [existing issues](../../issues)
        first to avoid duplicates. For security vulnerabilities, use
        [private vulnerability reporting](../../security/advisories/new) instead of an issue.

  - type: input
    id: package
    attributes:
      label: Package and version
      description: Which `@buildr/*` package, and which version?
      placeholder: '@buildr/core@0.4.0'
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: >
        Minimal steps to reproduce, ideally a link to a minimal repo, StackBlitz, or
        code sample. Bugs without a reproduction take much longer to fix.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Node version, browser, Next.js version, Payload version, OS — whatever's relevant.
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or error output
      render: shell
    validations:
      required: false
